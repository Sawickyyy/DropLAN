name: Build DropLAN Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.4.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DropLAN.csproj

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish DropLAN.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=${{ inputs.version }} `
            -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Download previous release
        shell: pwsh
        continue-on-error: true
        run: |
          vpk download github `
            --repoUrl https://github.com/${{ github.repository }} `
            --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        shell: pwsh
        run: |
          vpk pack `
            -u DropLAN `
            -v ${{ inputs.version }} `
            -p publish `
            --mainExe DropLAN.exe

      - name: Upload GitHub Release
        shell: pwsh
        run: |
          vpk upload github `
            --repoUrl https://github.com/${{ github.repository }} `
            --token ${{ secrets.GITHUB_TOKEN }} `
            --publish `
            --releaseName "DropLAN ${{ inputs.version }}" `
            --tag "v${{ inputs.version }}"
